name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el SDK de Android preinstalado.
      # La clave de firma (debug.keystore) se reconstruye desde debug.keystore.base64
      # dentro de build.gradle.kts, así que no hace falta un paso aquí.

      - name: (Opcional) Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restaurado (build CON Firebase)."
          else
            echo "Sin secret: build SIN Firebase (la APK instala y abre)."
          fi

      # Fijamos Gradle 8.7 (el runner ahora trae Gradle 9, incompatible con AGP 8.5).
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: antitheft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica la APK en un Release con tag fijo "latest" -> link estable para instalar.
      - name: Publicar Release con la APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última APK (debug)
          files: android/app/build/outputs/apk/debug/app-debug.apk
