<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Antitheft</title>
<meta name="description" content="Portal para controlar tus dispositivos Antitheft: activar funciones, localizar, bloquear y ver el historial de ubicaciones." />
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --card-2: #f0f2f5; --border: #e1e4e8;
    --text: #1f2328; --muted: #656d76; --primary: #1f6feb; --primary-ink: #ffffff;
    --danger: #cf222e; --good: #1a7f37;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0d1117; --card: #161b22; --card-2: #1c222b; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --primary: #4c8dff; --primary-ink: #0b1220;
      --danger: #ff7b72; --good: #3fb950;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --card: #161b22; --card-2: #1c222b; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --primary: #4c8dff; --primary-ink: #0b1220;
    --danger: #ff7b72; --good: #3fb950;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Manrope", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
  a { color: var(--primary); }
  .wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 500;
    background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand svg { width: 26px; height: 26px; color: var(--primary); }
  .spacer { flex: 1; }
  .who { color: var(--muted); font-size: 13px; max-width: 45vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 9px 14px; transition: border-color .15s; }
  button:hover { border-color: var(--primary); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 600; }
  .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .btn-ghost { background: transparent; }

  .login { min-height: 70vh; display: grid; place-items: center; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .row-btns { display: grid; gap: 10px; margin-top: 18px; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .msg.err { color: var(--danger); }

  .app { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding-block: 22px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin-bottom: 8px; margin-top: 18px; }
  .section-label:first-child { margin-top: 0; }

  .device { width: 100%; text-align: left; display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; }
  .device.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .device .name { font-weight: 700; }
  .device .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 18px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .toggle-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
  .toggle-row.first { border-top: none; }
  .toggle-row .txt { flex: 1; }
  .toggle-row .txt .t { font-weight: 600; }
  .toggle-row .txt .d { font-size: 12.5px; color: var(--muted); }

  .switch { position: relative; width: 46px; height: 27px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 999px; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 19px; width: 19px; left: 3px; top: 3px;
    background: var(--muted); border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: color-mix(in srgb, var(--primary) 30%, transparent); border-color: var(--primary); }
  .switch input:checked + .slider::before { transform: translateX(19px); background: var(--primary); }

  .statusrow { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--border); }
  .chip-when { font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .dot.off { background: var(--danger); }
  .chip.live-on { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
  .chip.live-off { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .cmds { display: flex; flex-wrap: wrap; gap: 10px; }
  #map { height: 300px; width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-top: 4px;
    background: var(--card-2); }
  .leaflet-container { font-family: inherit; }

  .history { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .hist-day { padding: 8px 14px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); background: var(--card-2);
    border-top: 1px solid var(--border); }
  .hist-day:first-child { border-top: none; }
  .hist-item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 14px; cursor: pointer; border-top: 1px solid var(--border); font-size: 13px; }
  .hist-item:hover { background: var(--card-2); }
  .hi-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hi-time { color: var(--text); font-weight: 600; }
  .hi-co { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dur { flex: none; font-size: 12px; color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); border-radius: 999px; padding: 3px 10px; }

  .empty { color: var(--muted); text-align: center; padding: 40px 16px; }

  .alert-item { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .alert-item.warn { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .alert-head { display: flex; align-items: center; gap: 8px; }
  .alert-ico { font-size: 16px; }
  .alert-txt { flex: 1; font-size: 13px; font-weight: 600; }
  .intruder-img { margin-top: 8px; width: 100%; max-width: 260px; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  #photoModal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 1000; padding: 20px; }
  #photoModal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }

  /* --- Ajustes para celulares --- */
  @media (max-width: 560px) {
    .wrap { padding-inline: 12px; }
    .app { gap: 14px; padding-block: 16px; }
    .panel { padding: 15px; border-radius: 14px; }
    .brand { font-size: 16px; }
    .brand svg { width: 22px; height: 22px; }
    .bar { gap: 8px; padding-block: 11px; }
    #map { height: 260px; }
    /* Botones de comando: ocupan el ancho disponible en 2 columnas */
    .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cmds button { width: 100%; }
    .login-card { padding: 22px; }
  }
  @media (max-width: 360px) {
    .cmds { grid-template-columns: 1fr; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<header>
  <div class="wrap bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Z"/></svg>
      Antitheft
    </div>
    <div class="spacer"></div>
    <span id="who" class="who" hidden></span>
    <button id="btnLogout" class="btn-ghost" hidden>Salir</button>
  </div>
</header>

<main class="wrap">
  <section id="loginView" class="login" hidden>
    <div class="login-card">
      <h1>Panel Antitheft</h1>
      <p>Ingresá con la misma cuenta que usás en la app para controlar tus dispositivos.</p>
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" placeholder="vos@ejemplo.com" />
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div class="row-btns">
        <button id="btnSignIn" class="btn-primary">Ingresar</button>
        <button id="btnRegister" class="btn-ghost">Crear cuenta nueva</button>
      </div>
      <div id="loginMsg" class="msg"></div>
    </div>
  </section>

  <section id="appView" class="app" hidden>
    <aside>
      <div class="section-label">Dispositivos</div>
      <div id="deviceList"></div>
    </aside>
    <div id="detailWrap">
      <div class="panel"><div class="empty">Elegí un dispositivo de la izquierda.</div></div>
    </div>
  </section>
</main>

<div id="photoModal" hidden onclick="this.hidden=true"><img alt="Foto de intruso"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAAbX-b6eY5-mkn2XpNViyG7_jJ1ngQnQg",
    authDomain: "antitheft-2b140.firebaseapp.com",
    projectId: "antitheft-2b140",
    storageBucket: "antitheft-2b140.firebasestorage.app",
    messagingSenderId: "760057514633",
    appId: "1:760057514633:android:b30827d61c5f4a62dd9458"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const $ = (id) => document.getElementById(id);

  let devicesUnsub = null, deviceUnsub = null, locUnsub = null, alertsUnsub = null, selectedId = null;
  let map = null, lastMarker = null, trackLine = null, histMarkers = [];
  let selData = null, devSnapData = [];

  // Refresca los indicadores "en línea" aunque no lleguen datos nuevos (para pasar a rojo solo).
  setInterval(() => {
    if (selData && $("dStatus")) $("dStatus").innerHTML = statusHTML(selData.status);
    document.querySelectorAll("#deviceList .device").forEach((el, i) => {
      if (devSnapData[i]) deviceMeta(el.querySelector(".meta"), devSnapData[i]);
    });
  }, 30000);

  // ---- Auth ----
  $("btnSignIn").onclick = () => doAuth(false);
  $("btnRegister").onclick = () => doAuth(true);
  $("btnLogout").onclick = () => auth.signOut();

  function doAuth(register) {
    const email = $("email").value.trim(), pass = $("pass").value;
    if (!email || pass.length < 6) return setMsg("Ingresá un correo válido y una contraseña de 6+ caracteres.", "err");
    setMsg("Conectando…", "");
    (register ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass))
      .catch((e) => setMsg(traducir(e.code) || e.message, "err"));
  }
  function setMsg(t, cls) { $("loginMsg").textContent = t; $("loginMsg").className = "msg " + (cls || ""); }
  function traducir(code) {
    return ({
      "auth/invalid-email": "El correo no es válido.",
      "auth/invalid-credential": "Correo o contraseña incorrectos.",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/user-not-found": "No existe una cuenta con ese correo. Probá 'Crear cuenta nueva'.",
      "auth/email-already-in-use": "Ya existe una cuenta con ese correo. Probá 'Ingresar'.",
      "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
      "auth/network-request-failed": "Sin conexión. Revisá tu internet.",
      "auth/operation-not-allowed": "Falta habilitar 'Correo/contraseña' en Firebase Authentication."
    })[code];
  }

  auth.onAuthStateChanged((user) => {
    if (user) {
      $("loginView").hidden = true; $("appView").hidden = false;
      $("who").hidden = false; $("who").textContent = user.email; $("btnLogout").hidden = false;
      watchDevices(user.uid);
    } else {
      $("appView").hidden = true; $("loginView").hidden = false;
      $("who").hidden = true; $("btnLogout").hidden = true;
      [devicesUnsub, deviceUnsub, locUnsub, alertsUnsub].forEach(u => u && u());
      selectedId = null; $("email").value = ""; $("pass").value = ""; setMsg("", "");
    }
  });

  // ---- Dispositivos ----
  function watchDevices(uid) {
    if (devicesUnsub) devicesUnsub();
    const col = db.collection("users").doc(uid).collection("devices");
    devicesUnsub = col.onSnapshot((snap) => {
      const list = $("deviceList");
      if (snap.empty) {
        list.innerHTML = '<div class="empty" style="padding:20px 8px">Todavía no hay dispositivos.<br>Vinculá la app con esta misma cuenta.</div>';
        return;
      }
      list.innerHTML = "";
      snap.forEach((doc) => {
        const d = doc.data();
        const el = document.createElement("button");
        el.className = "device" + (doc.id === selectedId ? " active" : "");
        el.innerHTML = '<div class="name"></div><div class="meta"></div>';
        el.querySelector(".name").textContent = d.name || "Dispositivo";
        deviceMeta(el.querySelector(".meta"), d);
        el.onclick = () => selectDevice(uid, doc.id);
        list.appendChild(el);
      });
      devSnapData = snap.docs.map(dc => dc.data());
      if (!selectedId) selectDevice(uid, snap.docs[0].id);
    }, () => { $("deviceList").innerHTML = '<div class="empty">No se pudo leer. Revisá las reglas de Firestore.</div>'; });
  }

  function selectDevice(uid, id) {
    selectedId = id;
    document.querySelectorAll(".device").forEach(e => e.classList.remove("active"));
    if (deviceUnsub) deviceUnsub();
    if (locUnsub) locUnsub();
    if (alertsUnsub) alertsUnsub();
    map = lastMarker = trackLine = null; histMarkers = [];

    const ref = db.collection("users").doc(uid).collection("devices").doc(id);
    buildDetailSkeleton(ref);

    deviceUnsub = ref.onSnapshot((doc) => {
      if (!doc.exists) return;
      updateDetail(ref, doc.data());
      const list = $("deviceList");
      list.querySelectorAll(".device").forEach(e => e.classList.remove("active"));
    });

    locUnsub = ref.collection("locations").orderBy("ts", "desc").limit(50)
      .onSnapshot((snap) => {
        const pts = [];
        snap.forEach(d => { const x = d.data(); if (x.lat != null) pts.push(x); });
        renderHistory(pts);
      }, () => {});

    alertsUnsub = ref.collection("alerts").orderBy("ts", "desc").limit(20)
      .onSnapshot((snap) => {
        const items = [];
        snap.forEach(d => items.push(d.data()));
        renderAlerts(items);
      }, () => {});
  }

  function buildDetailSkeleton(ref) {
    $("detailWrap").innerHTML = `
      <div class="panel">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <h2 id="dName" style="flex:1;min-width:120px">Dispositivo</h2>
          <button id="btnRename" class="btn-ghost" style="padding:6px 10px">Renombrar</button>
          <button id="btnDelete" class="btn-danger" style="padding:6px 10px">Eliminar</button>
        </div>
        <div class="sub" id="dModel"></div>
        <div id="dStatus" class="statusrow"></div>

        <div id="alertsWrap" hidden>
          <div class="section-label">Alertas</div>
          <div id="alerts"></div>
        </div>

        <div class="section-label">Funciones</div>
        <div class="toggle-row first">
          <div class="txt"><div class="t">Compartir ubicación (Familiar)</div><div class="d">Rastreo en segundo plano</div></div>
          <label class="switch"><input type="checkbox" id="tgTracking"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <div class="txt"><div class="t">Foto antirrobo</div><div class="d">Captura tras PIN fallidos</div></div>
          <label class="switch"><input type="checkbox" id="tgPhoto"><span class="slider"></span></label>
        </div>

        <div class="section-label">Comandos</div>
        <div class="cmds">
          <button id="cmdLocate" class="btn-primary">Localizar</button>
          <button id="cmdAlarm">Alarma</button>
          <button id="cmdStopAlarm" class="btn-danger">Detener alarma</button>
          <button id="cmdLock">Bloquear</button>
          <button id="cmdPhoto">Tomar foto</button>
          <button id="cmdUpdate">Actualizar app</button>
        </div>
        <input id="lockMsg" placeholder="Mensaje para mostrar al bloquear (opcional)" style="margin-top:10px" />

        <div class="section-label">Ubicación</div>
        <div id="map"></div>
        <div id="history" class="history"></div>
      </div>`;

    $("tgTracking").onchange = (e) => ref.set({ settings: { tracking: e.target.checked } }, { merge: true });
    $("tgPhoto").onchange = (e) => ref.set({ settings: { photo: e.target.checked } }, { merge: true });
    $("cmdLocate").onclick = () => sendCommand(ref, "LOCATE");
    $("cmdAlarm").onclick = () => sendCommand(ref, "ALARM");
    $("cmdStopAlarm").onclick = () => sendCommand(ref, "STOP_ALARM");
    $("cmdLock").onclick = () => sendCommand(ref, "LOCK", { message: $("lockMsg").value.trim() });
    $("cmdPhoto").onclick = () => sendCommand(ref, "PHOTO");
    $("cmdUpdate").onclick = () => sendCommand(ref, "UPDATE");
    $("btnRename").onclick = () => {
      const actual = $("dName").textContent;
      const nuevo = window.prompt("Nuevo nombre del dispositivo:", actual);
      if (nuevo && nuevo.trim()) ref.set({ name: nuevo.trim() }, { merge: true });
    };
    $("btnDelete").onclick = () => {
      if (window.confirm("¿Eliminar este dispositivo del portal?\n\n(No desinstala la app del teléfono. El teléfono que esté en uso volverá a aparecer al sincronizar; borrá solo los duplicados viejos.)")) {
        deleteDevice(ref);
      }
    };
  }

  async function deleteDevice(ref) {
    try {
      const locs = await ref.collection("locations").limit(500).get();
      if (!locs.empty) {
        const b = db.batch();
        locs.forEach((d) => b.delete(d.ref));
        await b.commit();
      }
      await ref.delete();
      selectedId = null;
      if (deviceUnsub) deviceUnsub();
      if (locUnsub) locUnsub();
      $("detailWrap").innerHTML = '<div class="panel"><div class="empty">Dispositivo eliminado. Elegí otro de la izquierda.</div></div>';
    } catch (e) {
      window.alert("No se pudo eliminar: " + (e.message || e));
    }
  }

  function updateDetail(ref, d) {
    $("dName").textContent = d.name || "Dispositivo";
    $("dModel").textContent = d.model || "";
    const st = d.status;
    const stEl = $("dStatus");
    if (stEl) {
      stEl.innerHTML = statusHTML(st);
    }
    selData = d; // para refrescar el indicador "en línea" con un timer
    const s = d.settings || {};
    if ($("tgTracking")) $("tgTracking").checked = !!s.tracking;
    if ($("tgPhoto")) $("tgPhoto").checked = !!s.photo;
    // Solo dibujamos lastLocation si el historial todavía no puso marcadores (evita pelear con él).
    if (d.lastLocation && histMarkers.length === 0) {
      const ll = d.lastLocation;
      showOnMap([{ lat: ll.lat, lng: ll.lng, startTs: ll.ts, endTs: ll.ts, count: 1 }], true);
    }
  }

  function ensureMap() {
    if (map) return map;
    map = L.map("map", { zoomControl: true }).setView([-34.6037, -58.3816], 12);
    // Esri World Street Map: gratis y sin API key (OSM bloquea y CARTO ahora pide clave).
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Tiles © Esri"
    }).addTo(map);
    return map;
  }

  // --- Utilidades para agrupar el historial en "estadías" ---
  function metersBetween(a, b) {
    const R = 6371000, toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function fmtDur(ms) {
    const min = Math.round(ms / 60000);
    if (min < 1) return "un momento";
    if (min < 60) return min + " min";
    const h = Math.floor(min / 60), m = min % 60;
    return m ? `${h} h ${m} min` : `${h} h`;
  }
  function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  // El teléfono late cada 5 min; con margen consideramos "en línea" si reportó hace < 12 min.
  function estaEnLinea(ts) { return ts && (Date.now() - ts) < 12 * 60 * 1000; }
  function statusHTML(st) {
    if (!st) return '<span class="chip live-off"><span class="dot off"></span>Sin datos</span> <span class="chip-when">Aún no reportó estado.</span>';
    const bat = (st.battery != null && st.battery >= 0) ? st.battery + "%" : "—";
    const online = estaEnLinea(st.ts);
    const live = `<span class="chip ${online ? "live-on" : "live-off"}"><span class="dot ${online ? "on" : "off"}"></span>${online ? "En línea" : "Sin conexión"}</span>`;
    return `${live} <span class="chip">🔋 ${bat}</span> <span class="chip">📶 ${st.network || "—"}</span> <span class="chip-when">${hace(st.ts)}</span>`;
  }
  function deviceMeta(metaEl, d) {
    if (!metaEl) return;
    const online = estaEnLinea(d.status?.ts);
    metaEl.innerHTML = `<span class="dot ${online ? "on" : "off"}"></span>`;
    metaEl.appendChild(document.createTextNode((d.model || "") + " · " + hace(d.status?.ts)));
  }
  function hace(ts) {
    if (!ts) return "—";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "recién";
    const m = Math.floor(s / 60); if (m < 60) return `hace ${m} min`;
    const h = Math.floor(m / 60); if (h < 24) return `hace ${h} h`;
    const d = Math.floor(h / 24); return `hace ${d} día${d > 1 ? "s" : ""}`;
  }
  function dayLabel(ts) {
    const d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, t)) return "Hoy";
    if (same(d, y)) return "Ayer";
    return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  // Agrupa puntos consecutivos cercanos (≤70 m, sin cortes de +20 min) en una sola estadía.
  function buildStays(ptsDesc) {
    const pts = [...ptsDesc].reverse(); // a orden cronológico
    const stays = [];
    for (const p of pts) {
      const cur = stays[stays.length - 1];
      const gap = cur ? p.ts - cur.endTs : Infinity;
      if (cur && metersBetween(cur, p) <= 70 && gap <= 20 * 60000) {
        cur.endTs = p.ts; cur.count++;
        cur.lat = (cur.lat * (cur.count - 1) + p.lat) / cur.count;
        cur.lng = (cur.lng * (cur.count - 1) + p.lng) / cur.count;
      } else {
        stays.push({ lat: p.lat, lng: p.lng, startTs: p.ts, endTs: p.ts, count: 1 });
      }
    }
    return stays.reverse(); // más reciente primero
  }

  function renderAlerts(items) {
    const wrap = $("alertsWrap"), box = $("alerts");
    if (!box) return;
    if (!items.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    box.innerHTML = "";
    items.forEach((a) => {
      const el = document.createElement("div");
      el.className = "alert-item" + (a.type === "SIM_CHANGED" ? " warn" : "");
      const ico = a.type === "INTRUDER_PHOTO" ? "📷" : (a.type === "SIM_CHANGED" ? "⚠️" : "🔔");
      el.innerHTML = `<div class="alert-head"><span class="alert-ico"></span><span class="alert-txt"></span><span class="chip-when"></span></div>`;
      el.querySelector(".alert-ico").textContent = ico;
      el.querySelector(".alert-txt").textContent =
        a.type === "INTRUDER_PHOTO" ? "Foto de intruso" : (a.detail || a.type);
      el.querySelector(".chip-when").textContent = hace(a.ts);
      if (a.type === "INTRUDER_PHOTO" && a.photo) {
        const img = document.createElement("img");
        img.className = "intruder-img"; img.src = a.photo; img.alt = "Foto de intruso";
        img.onclick = () => openPhoto(a.photo);
        el.appendChild(img);
      }
      box.appendChild(el);
    });
  }
  function openPhoto(src) {
    const m = $("photoModal"); if (!m) return;
    m.querySelector("img").src = src; m.hidden = false;
  }

  function renderHistory(pts) {
    const h = $("history");
    if (!h) return;
    if (!pts.length) {
      h.innerHTML = '<div class="empty" style="padding:20px">Sin ubicaciones todavía. Usá "Localizar" o activá "Compartir ubicación".</div>';
      showOnMap([], false);
      return;
    }
    const stays = buildStays(pts);
    h.innerHTML = "";
    let lastDay = null;
    stays.forEach((s) => {
      const dl = dayLabel(s.startTs);
      if (dl !== lastDay) {
        lastDay = dl;
        const hd = document.createElement("div");
        hd.className = "hist-day";
        hd.textContent = dl;
        h.appendChild(hd);
      }
      const moved = s.endTs - s.startTs > 60000;
      const el = document.createElement("div");
      el.className = "hist-item";
      const timeTxt = moved ? `${fmtTime(s.startTs)} – ${fmtTime(s.endTs)}` : fmtTime(s.startTs);
      const durTxt = moved ? fmtDur(s.endTs - s.startTs) : "punto";
      el.innerHTML = `
        <div class="hi-main">
          <span class="hi-time"></span>
          <span class="hi-co mono"></span>
        </div>
        <span class="dur"></span>`;
      el.querySelector(".hi-time").textContent = timeTxt;
      el.querySelector(".hi-co").textContent = Number(s.lat).toFixed(5) + ", " + Number(s.lng).toFixed(5);
      el.querySelector(".dur").textContent = durTxt;
      el.onclick = () => { ensureMap().setView([s.lat, s.lng], 16); };
      h.appendChild(el);
    });
    showOnMap(stays, false);
  }

  // Recibe "estadías" (más reciente primero). Dibuja un marcador por estadía y el recorrido.
  function showOnMap(stays, isLast) {
    const m = ensureMap();
    histMarkers.forEach(x => m.removeLayer(x)); histMarkers = [];
    if (trackLine) { m.removeLayer(trackLine); trackLine = null; }
    if (!stays || !stays.length) return;

    const ordered = [...stays].reverse(); // cronológico para la línea
    const latlngs = ordered.map(s => [s.lat, s.lng]);

    if (latlngs.length > 1) {
      trackLine = L.polyline(latlngs, { color: "#1f6feb", weight: 3, opacity: .6, dashArray: "4 6" }).addTo(m);
    }
    ordered.forEach((s, idx) => {
      const newest = idx === ordered.length - 1;
      const startTs = s.startTs ?? s.ts, endTs = s.endTs ?? s.ts;
      const durMs = (endTs || 0) - (startTs || 0);
      const mk = L.circleMarker([s.lat, s.lng], {
        radius: newest ? 9 : (durMs > 60000 ? 7 : 5),
        color: newest ? "#1f6feb" : "#8b949e",
        fillColor: newest ? "#1f6feb" : "#8b949e",
        fillOpacity: newest ? 1 : .65, weight: 2
      }).addTo(m);
      const range = durMs > 60000
        ? `${fmtTime(startTs)} – ${fmtTime(endTs)} (${fmtDur(durMs)})`
        : fmtTime(startTs);
      mk.bindPopup((newest ? "<b>Última ubicación</b><br>" : "") + dayLabel(startTs) + "<br>" + range);
      histMarkers.push(mk);
    });

    const last = ordered[ordered.length - 1];
    if (latlngs.length > 1) m.fitBounds(L.latLngBounds(latlngs).pad(0.2));
    else m.setView([last.lat, last.lng], 16);
    setTimeout(() => m.invalidateSize(), 100);
  }

  function sendCommand(ref, type, extra) {
    const id = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    ref.set({ command: Object.assign({ type, id, ts: Date.now() }, extra || {}) }, { merge: true });
  }
</script>
