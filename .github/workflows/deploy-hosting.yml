name: Desplegar portal (Firebase Hosting)
on:
  push:
    branches: [ main ]
    paths:
      - 'web-panel/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANTITHEFT }}
          channelId: live
          projectId: antitheft-2b140
