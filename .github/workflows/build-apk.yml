name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: (Opcional) Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Generar Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: antitheft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Release con la APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última APK (debug)
          files: android/app/build/outputs/apk/debug/app-debug.apk
