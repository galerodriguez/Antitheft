name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el SDK de Android preinstalado.

      - name: (Opcional) Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restaurado (build CON Firebase)."
          else
            echo "Sin secret: build SIN Firebase (la APK instala y abre)."
          fi

      - name: Generar Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: antitheft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
